<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Star Resonance Overlay</title>
    <style>
        #topActions{
            position: fixed;
            right: 8px;
            top: 8px;
            z-index: 10001;
            display: flex;
            gap: 6px;
        }

        #topActions .act{
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        #topActions .act:hover{
            background: rgba(0,0,0,0.75);
        }

        :root{
            --scale: 1;
            --opacity: 0.85;
        }
        body{
            margin:0;
            background: transparent;
            font-family: "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
        }

        /* toast */
        #toast{
            position: fixed;
            right: 8px;
            top: 44px;           /* 在按钮下面 */
            z-index: 10000;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.70);
            color: #fff;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition: opacity .15s ease, transform .15s ease;
        }
        #toast.show{
            opacity: 1;
            transform: translateY(0);
        }

        /* 整条底板 */
        #bar{
            display: inline-flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 8px;
            background: rgba(0,0,0,var(--opacity));
            transform: scale(var(--scale));
            transform-origin: top left;
            user-select: none;
        }
        /* 单个图标 */
        .icon{
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset;
        }

        .icon::before{
            content:"";
            position:absolute; inset:0;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
        }
        /* 倒计时数字 */
        /* 持续时间（左上，黄字） */
        .dur{
            position:absolute;
            left:4px;
            top:2px;
            font-weight:800;
            font-size:14px;
            color:#ffd75a;
            text-shadow:0 2px 6px rgba(0,0,0,0.9);
        }
        /* 冷却时间（右下，红字） */
        .cd{
            position:absolute;
            right:4px;
            bottom:2px;
            font-weight:800;
            font-size:16px;
            color: #2affc6;
            text-shadow:0 2px 6px rgba(0,0,0,0.9);
        }
        /* 叠层数*/
        .stack{
            position:absolute;
            right: 4px;
            top: 2px;
            font-weight: 700;
            font-size: 12px;
            color:#fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            opacity: 0.95;
            display: block;
        }
    </style>
</head>
<body>
<div id="topActions">
    <div class="act" id="btnClear">🧹 清空</div>
    <div class="act" id="btnConfig">⚙ 配置</div>
</div>

<div id="toast"></div>
<div id="bar"></div>

<script>
    const everSeen = Object.create(null);

    const CFG_API = "http://127.0.0.1:8787";

    // ===== 静态文件路径=====
    const STATE_URL = "state.json";
    const OVERLAY_MAP_URL = "overlay_map.json";

    let userCfg = {};

    const lastDur = {};
    let watchById = {};
    const localCdUntil = {}; // { [buffId]: ms }

    let state = {};
    let overlayMap = {};
    let watchlist = [];
    window.__setPanelHidden = function(hidden){
        const bar = document.getElementById("topActions");
        if (bar) bar.style.display = hidden ? "none" : "flex";
    };
    function toast(msg, ms = 900){
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t.__timer);
        t.__timer = setTimeout(() => t.classList.remove("show"), ms);
    }

    async function loadUserConfig(){
        try{
            const res = await fetch(CFG_API + "/config?_=" + Date.now());
            userCfg = await res.json();
        }catch(e){
            userCfg = {};
        }
    }
    function getWatchOverride(){
        return userCfg?.overlay?.watch || {};
    }
    function getPinOverride(){
        return userCfg?.overlay?.pin || {};
    }

    function isWatchedByUser(id){
        const ov = getWatchOverride();
        const k = String(id);
        return (k in ov) ? !!ov[k] : true; // 默认 true：没写过就当选中
    }

    async function loadState() {
        try {
            const res = await fetch(STATE_URL + "?_=" + Date.now());
            state = await res.json();
            for (const k of Object.keys(state)) everSeen[String(k)] = true;
        } catch (e) {
            console.error("[loadState] failed:", e);
        }
    }

    const bar = document.getElementById("bar");
    function getPriority(w, s, now) {
        const pinGroup = w.pin ? 0 : 1;

        let typeGroup = 2; // 普通
        if (w.hasCd) typeGroup = 0;
        else if (s?.durUntil && s.durUntil > now) typeGroup = 1; // 正在计时的持续

        return pinGroup * 10000 + typeGroup * 1000 + (w.order ?? 9999);
    }

    function render() {
        bar.innerHTML = "";
        const now = Date.now();

        const list = watchlist.slice().sort((a, b) => {
            const sa = state[a.id];
            const sb = state[b.id];

            const aActive = !!(sa && sa.durUntil && sa.durUntil > now);
            const bActive = !!(sb && sb.durUntil && sb.durUntil > now);

            // 置顶 + CD（A）——永远第一
            if (a.pin && a.hasCd && !(b.pin && b.hasCd)) return -1;
            if (b.pin && b.hasCd && !(a.pin && a.hasCd)) return 1;

            // 置顶 + 正在触发（B / C）——插在 A 后面
            if (a.pin && aActive && !(b.pin && bActive)) return -1;
            if (b.pin && bActive && !(a.pin && aActive)) return 1;

            // 非置顶 + CD（A1）——永远在非置顶区最前
            if (!a.pin && a.hasCd && !(!b.pin && b.hasCd)) return -1;
            if (!b.pin && b.hasCd && !(!a.pin && a.hasCd)) return 1;

            // 非置顶 + 正在触发（B1 / C1）
            if (aActive && !bActive) return -1;
            if (bActive && !aActive) return 1;

            // 同组内稳定顺序
            return (a.order ?? 9999) - (b.order ?? 9999);
        });


        for (const w of list) {

            const isPermanent = !!w.permanent;
            const isEnabled = (w.enabled ?? w.show) !== false;
            if (!isEnabled) continue;
// ===== 特判：气劲加持 =====
// 不勾选常驻 → 永远不显示（无论 CD / dur）
            if (w.id === "2205391" && !w.permanent) {
                continue;
            }
            const id = String(w.id);
            const s = state[id]; // 可能 undefined

            const durRemain = s?.durUntil ? Math.max(0, (s.durUntil - now) / 1000) : 0;

            // cd：气劲走 local，其它优先后端 cdUntil，否则走 localCdUntil（本地兜底）
            const cdUntil =
                (id === "2205391")
                    ? (localCdUntil[id] ?? 0)
                    : (s?.cdUntil ?? (localCdUntil[id] ?? 0));

            const cdRemain = cdUntil ? Math.max(0, (cdUntil - now) / 1000) : 0;

            const durAlive = durRemain > 0;
            const cdAlive  = cdRemain > 0;

            const hasState = !!s;

            // 没状态且不是 permanent 就不显示
            // 没 state 且不是永久 → 只有“带CD监控”的也允许显示占位
            if (!hasState && !isPermanent && !w.hasCd) {
                continue;
            }


            const el = document.createElement("div");
            el.className = "icon";
            el.title = w.name;

            if (w.icon) {
                el.style.backgroundImage = `url("${w.icon}")`;
                el.style.backgroundSize = "cover";
                el.style.backgroundPosition = "center";
            }

            // dur（黄字）
            const durEl = document.createElement("div");
            durEl.className = "dur";
            durEl.textContent = durAlive
                ? (durRemain >= 10 ? Math.ceil(durRemain) : durRemain.toFixed(1))
                : (isPermanent && !w.hasCd ? "∞" : "");

            // cd（红字）：只有 hasCd 且 cdAlive 才显示；到 0 自动消失
            let cdEl = null;
            if (w.hasCd && cdAlive) {
                cdEl = document.createElement("div");
                cdEl.className = "cd";
                cdEl.textContent = (cdRemain >= 10 ? Math.ceil(cdRemain) : cdRemain.toFixed(1));
            }

            // stack（右上）
            const stackEl = document.createElement("div");
            stackEl.className = "stack";
            const st = s?.stack ?? 0;

// 只有 overlay_map 里明确声明 stacked 的，才显示层数
            if (w.stacked && st > 1) {
                stackEl.textContent = st;
            } else {
                stackEl.textContent = "";
            }


            el.appendChild(durEl);
            if (cdEl) el.appendChild(cdEl);
            el.appendChild(stackEl);
            bar.appendChild(el);
        }
    }

    function tick() {
        const now = Date.now();

        for (const w of watchlist) {
            const id = String(w.id);
            const s = state[id]; // 可能 undefined
            const hasState = !!s;
            const isPermanent = hasState && s.durUntil === 0;

            const durRemain = (!hasState || isPermanent)
                ? 0
                : Math.max(0, (s.durUntil - now) / 1000);

            const prevDur = lastDur[id] ?? 0;

            // ===== 气劲加持：本地固定 30s CD =====
            if (id === "2205391") {
                if (prevDur <= 0 && durRemain > 0) {
                    localCdUntil[id] = now + 30_000;
                }
            }

            // ===== 通用本地 CD 兜底：hasCd + baseCd（且后端没给 cdUntil）=====
            if (w.hasCd && (w.baseCd ?? 0) > 0) {
                const backendCdUntil = s?.cdUntil ?? 0;
                if (backendCdUntil <= 0) {
                    if (prevDur <= 0 && durRemain > 0) {
                        localCdUntil[id] = now + Math.round(w.baseCd * 1000);
                    }
                }
            }

            lastDur[id] = durRemain;
        }

        render();
        requestAnimationFrame(tick);
    }

    async function loadOverlayMap(){
        try{
            await loadUserConfig();

            const res = await fetch(OVERLAY_MAP_URL + "?_=" + Date.now());
            overlayMap = await res.json();

            const watchOverride = getWatchOverride();
            const pinOverride = getPinOverride();
            watchlist = Object.entries(overlayMap)
                .filter(([id, cfg]) => cfg && cfg.show === true)
                .map(([id, cfg]) => {
                    const idStr = String(id);
                    const enabled = (idStr in watchOverride) ? !!watchOverride[idStr] : true;

                    return {
                        id: idStr,
                        name: cfg?.name ?? idStr,
                        icon: cfg?.icon ?? "",
                        hasCd: !!cfg?.hasCd,
                        baseCd: Number(cfg?.baseCd ?? 0),
                        pin: (idStr in pinOverride) ? !!pinOverride[idStr] : !!cfg?.pin,
                        permanent: !!cfg?.permanent,
                        order: cfg?.order ?? 9999,
                        enabled
                    };
                });


            watchById = Object.create(null);
            for (const w of watchlist) watchById[w.id] = w;
        }catch(e){
            console.error("[loadOverlayMap] failed:", e);
            toast("overlay_map 读取失败");
        }
    }
    document.getElementById("btnConfig").onclick = () => {
        window.open("config.html", "_blank");
    };
    document.getElementById("btnClear").onclick = async () => {
        try{
            await fetch("http://127.0.0.1:8787/state/clear", { method: "POST" });
            toast("🧹 Buff 已清空");
        }catch(e){
            toast("❌ 清空失败");
        }
    };

    // ===== 启动 =====
    setInterval(loadState, 200);
    loadState();
    loadOverlayMap();
    requestAnimationFrame(tick);
    // ===== 同步用户配置（勾选 / 置顶变更）=====
    setInterval(async () => {
        try {
            await loadUserConfig();

            const watchOverride = getWatchOverride();
            const pinOverride = getPinOverride();

            let changed = false;

            for (const w of watchlist) {
                const id = String(w.id);

                const newEnabled =
                    (id in watchOverride) ? !!watchOverride[id] : true;

                const newPin =
                    (id in pinOverride) ? !!pinOverride[id] : w.pin;

                if (w.enabled !== newEnabled || w.pin !== newPin) {
                    w.enabled = newEnabled;
                    w.pin = newPin;
                    changed = true;
                }
            }

            if (changed) {
                render(); //
            }
        } catch (e) {
            //
        }
    }, 300);

    // CT=ON 时隐藏右上角按钮
    window.__setPanelHidden = function(hidden){
        const btn = document.getElementById("cfgBtn");
        if (btn) btn.style.display = hidden ? "none" : "block";
    };
</script>
</body>
</html>
